apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-notification
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-notification
  template:
    metadata:
      labels:
        app: payment-notification
    spec:
      containers:
        - name: payment-notification
          image: infra-payment-notification:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: payflow-config
            - secretRef:
                name: payflow-secrets
          env:
            - name: SERVER_PORT
              value: "8084"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-notification
  namespace: payflow
spec:
  selector:
    app: payment-notification
  ports:
    - port: 8084
      targetPort: 8084
