apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-intake
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-intake
  template:
    metadata:
      labels:
        app: payment-intake
    spec:
      containers:
        - name: payment-intake
          image: infra-payment-intake:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: payflow-config
            - secretRef:
                name: payflow-secrets
          env:
            - name: SERVER_PORT
              value: "8081"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-intake
  namespace: payflow
spec:
  selector:
    app: payment-intake
  ports:
    - port: 8081
      targetPort: 8081
