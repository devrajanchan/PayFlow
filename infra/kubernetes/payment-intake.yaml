apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-intake
  namespace: payflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-intake
  template:
    metadata:
      labels:
        app: payment-intake
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432 && nc -z kafka 29092; do echo waiting for postgres and kafka; sleep 2; done
      containers:
        - name: payment-intake
          image: infra-payment-intake:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms64M -Xmx256M"
            - name: SERVER_PORT
              value: "8081"
          envFrom:
            - configMapRef:
                name: payflow-config
            - secretRef:
                name: payflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-intake
  namespace: payflow
spec:
  selector:
    app: payment-intake
  ports:
    - port: 8081
      targetPort: 8081
